org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# R8 already runs in full mode (AGP 8.x default). This additionally lets R8 do
# the resource shrinking, which prunes unreachable resources more precisely and
# shrinks the resource table itself. Opt-in until AGP 9, where it is the default.
android.r8.optimizedResourceShrinking=true
